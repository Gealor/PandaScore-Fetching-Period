[project]
name = "cybersport-forum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.6.2",
    "aiohttp>=3.14.1",
    "celery>=5.6.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.0",
]

[tool.ruff.lint]
ignore = ["E203", "E266", "E501", "C408", "B010", "F401", "C901", "B008"]
select = ["B", "C", "E", "F", "W", "B9", "I", "SIM"]
# SIM - симплификатор кода, для избегания избыточности и сложности кода

[tool.ruff.lint.isort]
force-single-line = true
